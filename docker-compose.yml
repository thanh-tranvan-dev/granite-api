services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: granite
      POSTGRES_USER: granite
      POSTGRES_PASSWORD: granite
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granite -d granite"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://granite:granite@db:5432/granite
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

