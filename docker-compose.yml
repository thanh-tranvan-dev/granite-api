services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: granite
      POSTGRES_USER: granite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U granite -d granite"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://granite:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.development}@db:5432/granite
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_SALT: ${RATE_LIMIT_SALT:?Set RATE_LIMIT_SALT in .env}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY in .env}
      TURNSTILE_HOSTNAME: ${TURNSTILE_HOSTNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

